[package]
name = "stickerpack-maker"
version = "1.0.0"
license = "MIT"
description = "Local-first desktop app for making Telegram sticker packs"
edition = "2021"
# Not a published crate: cargo-about (about.toml `private.ignore`) then leaves the
# app itself out of THIRD-PARTY-NOTICES.txt instead of attributing it the
# vendored ONNX Runtime licence file in its own folder (SPM-29).
publish = false

# The library target is shared by the desktop binary (main.rs) and unit tests.
# `rlib` is required so `cargo test` can link against the app code.
[lib]
name = "stickerpack_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Reads the shared limits (../src/shared/limits.json); already in the tree via Tauri.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite from source: no system SQLite dependency on Windows.
rusqlite = { version = "0.32", features = ["bundled"] }
# Grapheme clusters: counts emoji as people see them (ZWJ sequences, flags,
# skin tones), for the Emoji String 1-20 warning. Already in the tree via Tauri.
unicode-segmentation = "1"
# Editor pixel work in Rust (ADR-0005). Decoders for the five import
# formats only (.jfif is JPEG); webp decoding is pure Rust (image-webp).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# High-quality, alpha-aware resizing for the import cap and sizing tools.
fast_image_resize = "6"
# 2D rasteriser: composites transformed layers for "merge selected layers"
# (and later the save flatten). Premultiplied RGBA internally.
tiny-skia = "0.12"
tauri-plugin-opener = "2"
# Text layers (SPM-9): fontdb finds the system fonts (Windows Fonts folders,
# fontconfig on Linux) and loads them by family; ab_glyph reads glyph
# outlines and metrics, which tiny-skia fills, so text is rasterised in Rust
# exactly the same for the view, merge, Crop and the save flatten.
fontdb = "0.24"
ab_glyph = "0.2"
# Emoji colour layers and fallback cmaps (SPM-20): the same version fontdb
# already pulls in, so no extra copy — read directly here for COLR/CPAL
# painting, GSUB emoji ligatures and cmap coverage checks.
ttf-parser = "0.25"
# Outline and fuzzy glow (SPM-8): Euclidean distance transform and box
# blurs. No default features: no rayon, and `image` stays as configured above.
imageproc = { version = "0.25", default-features = false }
# Background removal (SPM-7, ADR-0006): ONNX Runtime runs the segmentation
# model. `download-binaries` links pyke's prebuilt ONNX Runtime statically
# (no DLL to ship); pinned exactly because 2.0 is still a release candidate.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-31"] }
# The one-time model download (rustls, bundled roots: no OS TLS dependency)
# and its SHA-256 check. sha2 0.10 is already in the tree.
ureq = "3"
sha2 = "0.10"
# The save encoder (SPM-10): PNG/WEBP save encoding (editor/encode.rs), via
# libwebp compiled from vendored C and linked statically (no DLL to ship).
webp = { version = "0.3", default-features = false }

# Native file drag-out of the Upload list (SPM-21): CrabNebula's `drag`,
# OLE DoDragDrop with a CF_HDROP file list on Windows (the v1 target). Not
# built elsewhere: see src/drag_commands.rs.
[target.'cfg(windows)'.dependencies]
drag = "2.1.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The outline/glow preview (SPM-8, ADR-0008) re-runs imageproc while a
# slider moves: optimise the pixel crates even in `tauri dev`, where an
# unoptimised distance transform is several times slower. Our own crate
# stays fast to rebuild.
[profile.dev.package.imageproc]
opt-level = 3

[profile.dev.package.image]
opt-level = 3
