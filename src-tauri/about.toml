# cargo-about configuration for THIRD-PARTY-NOTICES.txt (SPM-29).
# Regenerate with `bun run licenses` (scripts/licenses.mjs).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# The shipped build is Windows only; dev and build dependencies do not ship.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Skip the app crate itself (`publish = false`): its folder holds the vendored
# ONNX Runtime licence, which would otherwise form a group with no "Used by" (SPM-29).
private = { ignore = true }

# libwebp-sys vendors Google's libwebp C sources (compiled in statically for
# the PNG/WEBP save encoder, SPM-10) but ships no top-level licence file, so
# cargo-about would only see the wrapper's MIT/Apache expression. Clarify to
# include libwebp's own BSD-3-Clause COPYING (the checksum pins the file, so a
# libwebp-sys upgrade makes cargo-about fail until this is reviewed).
[libwebp-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
[[libwebp-sys.clarify.files]]
path = "vendor/COPYING"
license = "BSD-3-Clause"
checksum = "5aec868f669e384a22372a4e8a1a6cd7d44c64cd451f960ca69cc170d1e13acf"
